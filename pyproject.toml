[project]
name = "football-ai-editor-2141"
version = "0.1.0"
description = "Agent-driven football short-video editor for Intel Mac, using MiniMax cloud TTS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
football-ai-editor = "football_ai_editor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
